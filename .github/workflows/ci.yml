name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# 前置：payipa 依赖 jianbing-utils（public 仓）经 git 源解析（tag v0.1.0）。
# 提交前须：① jianbing_utils 打并推 tag v0.1.0；② 把根 pyproject 的 [tool.uv.sources]
# 从本地 path 源换成 git 源；③ uv lock 后提交。详见 CLAUDE.md。
jobs:
  quality:
    runs-on: ubuntu-latest
    # P0-19：真三库 CI——PG service + 三库创建 + 迁移到 head，集成测试不再静默 skip。
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres123
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      PG_USER: postgres
      PG_PASSWORD: postgres123
    steps:
      - uses: actions/checkout@v4
      # 钉 uv 版本（不用浮动 action tag）
      - name: Install uv 0.11.26
        run: curl -LsSf https://astral.sh/uv/0.11.26/install.sh | sh
      - name: Sync workspace (locked)
        run: uv sync --all-packages --locked
      - name: Ruff lint
        run: uv run ruff check
      - name: Ruff format check
        run: uv run ruff format --check
      - name: Import boundaries (import-linter)
        run: uv run lint-imports
      - name: Create three databases
        run: |
          for db in pyp_sys data_center business; do
            PGPASSWORD=postgres123 psql -h localhost -U postgres -c "CREATE DATABASE $db"
          done
      - name: Migrate three databases to head
        run: uv run alembic -c deploy/alembic.ini upgrade heads
      - name: Pytest
        # test_sandbox_pg 需 PG+Docker+活 uvicorn 三合一（本地已验证）；CI 首轮先不引入其镜像构建
        # 时间与抖动面，等发布安装冒烟（P0-02/03）一起编排。
        run: uv run pytest --deselect tests/test_sandbox_pg.py
