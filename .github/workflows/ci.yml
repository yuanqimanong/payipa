name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# payipa 依赖 jianbing-utils 的固定 Git tag（见 pyproject.toml / uv.lock）；镜像构建不依赖兄弟目录。
jobs:
  quality:
    runs-on: ubuntu-latest
    # P0-19：真三库 CI——PG service + 三库创建 + 迁移到 head，集成测试不再静默 skip。
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres123
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      PG_USER: postgres
      PG_PASSWORD: postgres123
    steps:
      - uses: actions/checkout@v4
      # 钉 uv 版本（不用浮动 action tag）
      - name: Install uv 0.11.26
        run: curl -LsSf https://astral.sh/uv/0.11.26/install.sh | sh
      - name: Sync workspace (locked)
        run: uv sync --all-packages --locked
      - name: Ruff lint
        run: uv run ruff check
      - name: Ruff format check
        run: uv run ruff format --check
      - name: Import boundaries (import-linter)
        run: uv run lint-imports
      - name: Compose configuration
        run: |
          uv run pypctl init
          PYP_AGENT_ENROLL_TOKEN=ci-placeholder docker compose -f deploy/compose.yml --env-file deploy/.env.compose config -q
      - name: Build release images from repository only
        run: |
          docker build -f deploy/Dockerfile.server -t payipa-server:ci .
          docker build -f packages/pyp-agent/Dockerfile -t payipa-agent:ci .
          docker build -f packages/pyp-agent/Dockerfile.browser -t payipa-agent-browser:ci .
      - name: Clean Compose install smoke
        # 用发布编排真实启动 db -> migrate -> server；防止文档和静态 config 校验绿、实际容器起不来的回归。
        run: |
          uv run pypctl doctor
          uv run pypctl up --build
          uv run pypctl smoke
      - name: Clean Compose teardown
        if: always()
        run: docker compose -f deploy/compose.yml --env-file deploy/.env.compose down -v --remove-orphans
      - name: Create three databases
        run: |
          for db in pyp_sys data_center business; do
            PGPASSWORD=postgres123 psql -h localhost -U postgres -c "CREATE DATABASE $db"
          done
      - name: Migrate three databases to head
        run: uv run alembic -c deploy/alembic.ini upgrade heads
      - name: Pytest
        # 包含 PG 三库、Docker 沙箱和主控/Agent 契约测试；任一真实依赖被 skip 都由测试自身显式报告。
        run: uv run pytest
