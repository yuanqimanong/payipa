{% extends "base.html" %}
{% block title %}公共配置{% endblock %}
{% block content %}
<div class="page-head">
  <div class="titles">
    <h2>公共配置</h2>
    <p>AI 模型、通知机器人与存储后端登记（凭证均 KEK 加密入库，此处不显示明文）。</p>
  </div>
</div>

<div class="card">
  <div class="card-head model-head">AI / LLM 模型 <button class="btn sm" id="new-model" type="button">＋ 登记模型</button></div>
  <div class="card-pad" id="model-form" hidden>
    <div class="grid cols-3" style="gap:12px">
      <div class="field"><label>登记名</label><input id="m-name" autocomplete="off" /></div>
      <div class="field"><label>提供方</label><input id="m-provider" placeholder="anthropic / echo" autocomplete="off" /></div>
      <div class="field"><label class="check-row"><input type="checkbox" id="m-default" /> 设为平台默认</label></div>
    </div>
    <div class="field"><label>配置 JSON（api_key / model_id 等，KEK 加密）</label>
      <textarea id="m-config" rows="3" placeholder='{"api_key": "sk-...", "model_id": "claude-opus-4-8"}'></textarea></div>
    <div id="m-err" class="form-error" hidden></div>
    <div class="form-actions"><button class="btn" id="m-submit" type="button">登记</button>
      <button class="btn ghost" id="m-cancel" type="button">取消</button></div>
  </div>
  <div id="models"><div class="empty">加载中…</div></div>
</div>

<div class="card" style="margin-top:16px">
  <div class="card-head model-head">系统提示词 <button class="btn sm" id="new-prompt" type="button">＋ 新建/编辑</button></div>
  <div class="card-pad" id="prompt-form" hidden>
    <div class="field"><label>名称（同名保存即版本 +1）</label><input id="p-name" autocomplete="off" /></div>
    <div class="field"><label>内容</label><textarea id="p-content" rows="5"></textarea></div>
    <div id="p-err" class="form-error" hidden></div>
    <div class="form-actions"><button class="btn" id="p-submit" type="button">保存</button>
      <button class="btn ghost" id="p-cancel" type="button">取消</button></div>
  </div>
  <div id="prompts"></div>
</div>

<div class="card" style="margin-top:16px">
  <div class="card-head model-head">通知机器人 <button class="btn sm" id="new-bot" type="button">＋ 新建机器人</button></div>
  <div class="card-pad" id="bot-form" hidden>
    <div class="grid cols-2" style="gap:12px">
      <div class="field"><label>名称</label><input id="b-name" autocomplete="off" /></div>
      <div class="field"><label>类型</label>
        <select id="b-type"><option value="webhook">webhook</option><option value="lark">lark</option><option value="email">email</option></select></div>
    </div>
    <div class="field"><label>配置 JSON（KEK 加密）</label>
      <textarea id="b-config" rows="3" placeholder='{"url": "https://example.com/hook"}'></textarea></div>
    <div id="b-err" class="form-error" hidden></div>
    <div class="form-actions"><button class="btn" id="b-submit" type="button">创建</button>
      <button class="btn ghost" id="b-cancel" type="button">取消</button></div>
  </div>
  <div id="bots"></div>
</div>

<div class="card" style="margin-top:16px"><div class="card-head">存储后端</div><div id="stores"></div></div>
<script src="/static/views.js"></script>
<script>
  const esc = PypViews.esc;

  async function postJSON(url, body, method = "POST") {
    const resp = await fetch(url, {
      method, headers: { "Content-Type": "application/json", Accept: "application/json" },
      body: body == null ? null : JSON.stringify(body),
    });
    if (!resp.ok) throw new Error((await resp.json().catch(() => ({}))).detail || `HTTP ${resp.status}`);
    return resp.json().catch(() => ({}));
  }

  function renderModels(models) {
    const el = document.getElementById("models");
    const cols = [
      { key: "id", label: "#", type: "mono" },
      { key: "name", label: "名称" },
      { key: "provider", label: "提供方", type: "badge" },
      { key: "enabled", label: "启用", type: "bool" },
      { key: "is_default", label: "默认", type: "bool" },
    ];
    const head = "<tr>" + cols.map((c) => `<th>${c.label}</th>`).join("") + "<th style='text-align:right'>操作</th></tr>";
    const rows = models.length
      ? models.map((m) => "<tr>" + cols.map((c) => PypViews.cell(m, c)).join("") +
          `<td style="text-align:right">` +
          `<button class="btn ghost sm m-toggle" data-id="${m.id}" data-to="${m.enabled ? "false" : "true"}">${m.enabled ? "禁用" : "启用"}</button> ` +
          (m.is_default ? "" : `<button class="btn ghost sm m-default" data-id="${m.id}">设默认</button>`) +
          `</td></tr>`).join("")
      : `<tr><td colspan="${cols.length + 1}"><div class="empty">还没有登记模型（可先登记 provider=echo 离线冒烟）</div></td></tr>`;
    el.innerHTML = `<div class="table-wrap"><table class="tbl"><thead>${head}</thead><tbody>${rows}</tbody></table></div>`;
    el.querySelectorAll("button.m-toggle").forEach((b) => b.addEventListener("click", async () => {
      try { await postJSON(`/api/config/llm-models/${b.dataset.id}/enabled`, { enabled: b.dataset.to === "true" }); load(); }
      catch (e) { PypViews.toast(e.message, "err"); }
    }));
    el.querySelectorAll("button.m-default").forEach((b) => b.addEventListener("click", async () => {
      try { await postJSON(`/api/config/llm-models/${b.dataset.id}/default`, null); load(); } catch (e) { PypViews.toast(e.message, "err"); }
    }));
  }

  function renderBots(bots) {
    const el = document.getElementById("bots");
    const cols = [{ key: "id", label: "#", type: "mono" }, { key: "name", label: "名称" }, { key: "type", label: "类型", type: "badge" }];
    const head = "<tr>" + cols.map((c) => `<th>${c.label}</th>`).join("") + "<th style='text-align:right'>操作</th></tr>";
    const rows = bots.length
      ? bots.map((b) => "<tr>" + cols.map((c) => PypViews.cell(b, c)).join("") +
          `<td style="text-align:right"><button class="btn ghost sm bot-test" data-id="${b.id}">测试通知</button> ` +
          `<button class="btn ghost sm bot-del" data-id="${b.id}" data-name="${esc(b.name)}">删除</button></td></tr>`).join("")
      : `<tr><td colspan="${cols.length + 1}"><div class="empty">还没有通知机器人</div></td></tr>`;
    el.innerHTML = `<div class="table-wrap"><table class="tbl"><thead>${head}</thead><tbody>${rows}</tbody></table></div>`;
    el.querySelectorAll("button.bot-test").forEach((btn) => btn.addEventListener("click", () => testBot(btn.dataset.id, btn)));
    el.querySelectorAll("button.bot-del").forEach((btn) => btn.addEventListener("click", async () => {
      if (!(await PypViews.ask(`删除通知机器人 ${btn.dataset.name}？`))) return;
      try { await postJSON(`/api/config/notify-bots/${btn.dataset.id}`, null, "DELETE"); load(); } catch (e) { PypViews.toast(e.message, "err"); }
    }));
  }

  async function testBot(id, btn) {
    btn.disabled = true;
    const label = btn.textContent;
    btn.textContent = "发送中…";
    try {
      await postJSON(`/api/notify/${id}/test`, { title: "payipa 测试通知", text: "这是一条来自 payipa 的测试通知。" });
      btn.textContent = "已发送 ✓";
    } catch (e) { PypViews.toast(`测试失败：${e.message}`, "err"); btn.textContent = label; }
    finally { setTimeout(() => { btn.textContent = label; btn.disabled = false; }, 2500); }
  }

  function parseJSONField(text, errEl) {
    const raw = text.trim();
    if (!raw) return {};
    try { return JSON.parse(raw); } catch { errEl.textContent = "配置不是合法 JSON"; errEl.hidden = false; return null; }
  }

  const pForm = document.getElementById("prompt-form"), pErr = document.getElementById("p-err");
  function renderPrompts(prompts) {
    const el = document.getElementById("prompts");
    const cols = [{ key: "name", label: "名称" }, { key: "version", label: "版本", type: "mono" }, { key: "length", label: "字数", type: "mono" }];
    const head = "<tr>" + cols.map((c) => `<th>${c.label}</th>`).join("") + "<th style='text-align:right'>操作</th></tr>";
    const rows = prompts.length
      ? prompts.map((p) => "<tr>" + cols.map((c) => PypViews.cell(p, c)).join("") +
          `<td style="text-align:right"><button class="btn ghost sm p-edit" data-name="${esc(p.name)}">编辑</button></td></tr>`).join("")
      : `<tr><td colspan="${cols.length + 1}"><div class="empty">还没有系统提示词</div></td></tr>`;
    el.innerHTML = `<div class="table-wrap"><table class="tbl"><thead>${head}</thead><tbody>${rows}</tbody></table></div>`;
    el.querySelectorAll("button.p-edit").forEach((b) => b.addEventListener("click", () => editPrompt(b.dataset.name)));
  }
  async function editPrompt(name) {
    try {
      const d = await PypViews.fetchJSON(`/api/config/system-prompts/${encodeURIComponent(name)}`);
      document.getElementById("p-name").value = d.name;
      document.getElementById("p-content").value = d.content;
      pForm.hidden = false; pErr.hidden = true;
    } catch (e) { PypViews.toast(e.message, "err"); }
  }

  async function load() {
    try {
      const d = await PypViews.fetchJSON("/api/views/config");
      renderModels(d.models || []);
      renderPrompts(d.system_prompts || []);
      renderBots(d.notify_bots || []);
      PypViews.renderTable(document.getElementById("stores"),
        [{ key: "id", label: "#", type: "mono" }, { key: "name", label: "名称" }, { key: "backend", label: "后端", type: "badge" }],
        d.storage || []);
    } catch (e) {
      document.getElementById("models").innerHTML = `<div class="empty err">${esc(e.message)}</div>`;
    }
  }

  // 表单开合
  const mForm = document.getElementById("model-form"), mErr = document.getElementById("m-err");
  document.getElementById("new-model").addEventListener("click", () => { mForm.hidden = !mForm.hidden; mErr.hidden = true; });
  document.getElementById("m-cancel").addEventListener("click", () => { mForm.hidden = true; });
  document.getElementById("m-submit").addEventListener("click", async () => {
    mErr.hidden = true;
    const name = document.getElementById("m-name").value.trim();
    const provider = document.getElementById("m-provider").value.trim();
    if (!name || !provider) { mErr.textContent = "登记名与提供方必填"; mErr.hidden = false; return; }
    const config = parseJSONField(document.getElementById("m-config").value, mErr);
    if (config === null) return;
    try {
      await postJSON("/api/config/llm-models", { name, provider, config, make_default: document.getElementById("m-default").checked });
      mForm.hidden = true; document.getElementById("m-name").value = ""; document.getElementById("m-provider").value = "";
      document.getElementById("m-config").value = ""; document.getElementById("m-default").checked = false;
      load();
    } catch (e) { mErr.textContent = e.message; mErr.hidden = false; }
  });

  document.getElementById("new-prompt").addEventListener("click", () => {
    document.getElementById("p-name").value = ""; document.getElementById("p-content").value = "";
    pForm.hidden = !pForm.hidden; pErr.hidden = true;
  });
  document.getElementById("p-cancel").addEventListener("click", () => { pForm.hidden = true; });
  document.getElementById("p-submit").addEventListener("click", async () => {
    pErr.hidden = true;
    const name = document.getElementById("p-name").value.trim();
    const content = document.getElementById("p-content").value;
    if (!name || !content.trim()) { pErr.textContent = "名称与内容必填"; pErr.hidden = false; return; }
    try {
      await postJSON("/api/llm/prompts", { name, content });  // 复用既有端点，更新即版本 +1
      pForm.hidden = true; load();
    } catch (e) { pErr.textContent = e.message; pErr.hidden = false; }
  });

  const bForm = document.getElementById("bot-form"), bErr = document.getElementById("b-err");
  document.getElementById("new-bot").addEventListener("click", () => { bForm.hidden = !bForm.hidden; bErr.hidden = true; });
  document.getElementById("b-cancel").addEventListener("click", () => { bForm.hidden = true; });
  document.getElementById("b-submit").addEventListener("click", async () => {
    bErr.hidden = true;
    const name = document.getElementById("b-name").value.trim();
    if (!name) { bErr.textContent = "名称必填"; bErr.hidden = false; return; }
    const config = parseJSONField(document.getElementById("b-config").value, bErr);
    if (config === null) return;
    try {
      await postJSON("/api/config/notify-bots", { name, type: document.getElementById("b-type").value, config });
      bForm.hidden = true; document.getElementById("b-name").value = ""; document.getElementById("b-config").value = "";
      load();
    } catch (e) { bErr.textContent = e.message; bErr.hidden = false; }
  });

  load();
</script>
{% endblock %}
