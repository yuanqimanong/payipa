<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>登录 · payipa</title>
    <link rel="stylesheet" href="/static/app.css" />
    <script>
      (function () { try { var s = localStorage.getItem("pyp-skin"); if (s) document.documentElement.dataset.skin = s; } catch (e) {} })();
    </script>
    <style>
      body { display: flex; min-height: 100vh; align-items: center; justify-content: center; }
      .login { width: 340px; }
      .login .brand { border: 0; padding: 0 0 20px; font-size: 18px; }
      .login .card { padding: 26px 26px 28px; box-shadow: var(--shadow); }
      .login h1 { font-size: 18px; margin: 0 0 4px; }
      .login .sub { color: var(--text-muted); font-size: 13px; margin-bottom: 18px; }
      .login .btn { width: 100%; justify-content: center; margin-top: 20px; padding: 10px; }
    </style>
  </head>
  <body>
    <form class="login" method="post" action="/login">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
      <div class="brand"><span class="logo">爬</span> <div>payipa <small>爬亿爬</small></div></div>
      <div class="card">
        <h1>登录</h1>
        <div class="sub">数据平台 · 账号由管理员开通（无自助注册）</div>
        <div class="field">
          <label for="username">用户名</label>
          <input id="username" name="username" autocomplete="username" autofocus />
        </div>
        <div class="field">
          <label for="password">密码</label>
          <input id="password" name="password" type="password" autocomplete="current-password" />
        </div>
        {% if error %}<div class="form-error" style="margin: 4px 0 0">{{ error }}</div>{% endif %}
        <button class="btn" type="submit">登录</button>
      </div>
    </form>
  </body>
</html>
