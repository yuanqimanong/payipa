<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>新建数据源 · payipa</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; color: #222; background: #f7f8fa; }
      header { background: #fff; border-bottom: 1px solid #e5e7eb; padding: 12px 24px; display: flex; align-items: center; gap: 16px; }
      header h1 { font-size: 17px; margin: 0; }
      header .spacer { flex: 1; }
      main { max-width: 820px; margin: 24px auto; padding: 0 16px; }
      .card { background: #fff; padding: 20px 22px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.05); }
      label { display: block; font-size: 13px; color: #444; margin: 14px 0 5px; font-weight: 600; }
      .hint { font-weight: 400; color: #999; }
      input, textarea { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; font-family: inherit; }
      textarea { min-height: 64px; }
      .row { display: grid; grid-template-columns: 1fr 2fr 130px 32px; gap: 8px; margin-bottom: 8px; align-items: center; }
      .row input { margin: 0; }
      .btn { display: inline-block; padding: 9px 16px; background: #2563eb; color: #fff; border-radius: 6px; text-decoration: none; font-size: 14px; border: 0; cursor: pointer; }
      .btn.sm { padding: 5px 10px; font-size: 13px; background: #e5edff; color: #2563eb; }
      .btn.ghost { background: #f3f4f6; color: #333; }
      .actions { margin-top: 20px; display: flex; gap: 10px; }
      .error { color: #dc2626; font-size: 13px; margin: 10px 0; }
      a.back { color: #2563eb; text-decoration: none; font-size: 13px; }
      code { background: #f0f0f0; padding: 1px 5px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <header>
      <h1>payipa / 爬亿爬</h1>
      <span style="color:#666;font-size:13px">新建数据源</span>
      <div class="spacer"></div>
      <span style="color:#666;font-size:13px">👤 {{ user.username }}</span>
    </header>
    <main>
      <a class="back" href="/sources">← 返回数据源列表</a>
      <form class="card" method="post" action="/sources/create" style="margin-top:12px">
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <label>名称</label>
        <input name="name" placeholder="如：图书列表" />
        <label>数据源短码（唯一，用作表名 <code>data_{短码}</code>）</label>
        <input name="uuid" placeholder="如：books" required />
        <label>种子 URL <span class="hint">每行一个</span></label>
        <textarea name="seed_urls" placeholder="https://books.toscrape.com/">https://books.toscrape.com/</textarea>
        <label>列表行选择器 item_locator <span class="hint">CSS；列表页每行一条记录，留空=整页一条</span></label>
        <input name="item_locator" placeholder="article.product_pod" value="article.product_pod" />

        <label>字段 <span class="hint">名称 / CSS 选择器（<code>sel@attr</code> 取属性）/ 类型</span></label>
        <div id="fields">
          <div class="row">
            <input name="field_name" placeholder="title" value="title" />
            <input name="field_css" placeholder="h3 a@title" value="h3 a@title" />
            <select name="field_type"><option value="store">store</option><option value="link">link</option><option value="store+link">store+link</option></select>
            <button type="button" class="btn sm" onclick="this.closest('.row').remove()">✕</button>
          </div>
          <div class="row">
            <input name="field_name" placeholder="price" value="price" />
            <input name="field_css" placeholder="p.price_color" value="p.price_color" />
            <select name="field_type"><option value="store">store</option><option value="link">link</option><option value="store+link">store+link</option></select>
            <button type="button" class="btn sm" onclick="this.closest('.row').remove()">✕</button>
          </div>
        </div>
        <button type="button" class="btn ghost sm" onclick="addRow()">＋ 添加字段</button>

        <label>数据指纹字段 <span class="hint">逗号分隔；用于去重 + 建索引</span></label>
        <input name="fingerprint" placeholder="title" value="title" />

        <div class="actions">
          <button class="btn" type="submit">创建并运行</button>
          <a class="btn ghost" href="/sources">取消</a>
        </div>
      </form>
    </main>
    <script>
      function addRow() {
        const tpl = document.querySelector("#fields .row");
        const row = tpl.cloneNode(true);
        row.querySelectorAll("input").forEach((i) => (i.value = ""));
        row.querySelector("select").selectedIndex = 0;
        document.getElementById("fields").appendChild(row);
      }
    </script>
  </body>
</html>
