{% extends "base.html" %}
{% block title %}数据组装{% endblock %}
{% block content %}
<div class="page-head">
  <div class="titles">
    <h2>数据组装</h2>
    <p>组装产物定义：版本状态机（draft/testing/active）、发布签名门、增量水位开关。</p>
  </div>
</div>
<div class="card" id="box"><div class="empty">加载中…</div></div>
<script src="/static/views.js"></script>
<script>
  PypViews.loadTable(document.getElementById("box"), "/api/views/assemblies", [
    { key: "id", label: "#", type: "mono" },
    { key: "name", label: "名称" },
    { key: "product_code", label: "产物表", type: "mono" },
    { key: "status", label: "状态", type: "badge" },
    { key: "version", label: "版本", type: "mono" },
    { key: "incremental", label: "增量", type: "bool" },
    { key: "signed", label: "已签名", type: "bool" },
    { key: "created_at", label: "创建时间", type: "time" },
  ]);
</script>
{% endblock %}
