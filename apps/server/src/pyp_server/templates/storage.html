{% extends "base.html" %}
{% block title %}存储管理{% endblock %}
{% block content %}
<div class="page-head">
  <div class="titles">
    <h2>存储管理</h2>
    <p>运行时对象存储后端与磁盘水位、raw 归档统计，以及登记的存储配置。</p>
  </div>
</div>
<div class="grid cols-3" id="stats" style="margin-bottom:16px"></div>
<div class="card"><div class="card-head">存储配置</div><div id="box"></div></div>
<script src="/static/views.js"></script>
<script>
  (async () => {
    const box = document.getElementById("box");
    try {
      const d = await PypViews.fetchJSON("/api/views/storage");
      const live = d.live || {}, st = d.stats || {};
      const mb = st.bytes != null ? (st.bytes / 1048576).toFixed(1) + " MB" : "—";
      PypViews.renderStats(document.getElementById("stats"), [
        { k: "运行时后端", v: live.backend || "—" },
        { k: "磁盘水位", v: live.disk_ok ? "正常" : "偏低", d: live.disk_ok ? "OK" : "低", dir: live.disk_ok ? "up" : "down" },
        { k: "raw 归档", v: st.artifacts != null ? st.artifacts + " 件 / " + mb : "—" },
      ]);
      PypViews.renderTable(box, [
        { key: "id", label: "#", type: "mono" },
        { key: "name", label: "名称" },
        { key: "backend", label: "后端", type: "badge" },
      ], d.configs || []);
    } catch (e) {
      box.innerHTML = `<div class="empty err">${PypViews.esc(e.message)}</div>`;
    }
  })();
</script>
{% endblock %}
