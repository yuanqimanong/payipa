{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="page-head">
  <div class="titles">
    <h2>{{ title }} <span class="mock-tag">● mock 数据</span></h2>
    <p id="desc" class="muted">该页面为占位（未实现），下方为 mock 演示数据，仅供查看/调试。</p>
  </div>
</div>
<div class="card"><div class="table-wrap"><table class="tbl"><thead id="thead"></thead><tbody id="tbody"></tbody></table></div></div>
<script>
  const KEY = {{ page_key | tojson }};
  const BADGE = { active: "green", online: "green", success: "green", done: "green", running: "blue", queued: "blue", assigned: "blue", testing: "amber", draft: "amber", paused: "amber", pending: "amber", disabled: "red", offline: "red", failed: "red", error: "red" };
  (async () => {
    const all = await (await fetch("/static/mock.json")).json();
    const d = all[KEY] || { columns: [], rows: [] };
    if (d.desc) document.getElementById("desc").textContent = d.desc;
    const cols = d.columns || [];
    document.getElementById("thead").innerHTML = "<tr>" + cols.map((c) => `<th>${c.label}</th>`).join("") + "</tr>";
    const body = (d.rows || []).map((r) => "<tr>" + cols.map((c) => {
      let v = r[c.key]; if (v == null) v = "";
      if (c.type === "badge") { const cls = BADGE[String(v).toLowerCase()] || ""; return `<td><span class="badge ${cls}"><span class="dot"></span>${v}</span></td>`; }
      if (c.type === "mono") return `<td><code>${v}</code></td>`;
      return `<td>${v}</td>`;
    }).join("") + "</tr>").join("");
    document.getElementById("tbody").innerHTML = body || `<tr><td colspan="${cols.length || 1}"><div class="empty">无数据</div></td></tr>`;
  })();
</script>
{% endblock %}
