{% extends "base.html" %}
{% block title %}数据推送{% endblock %}
{% block content %}
<div class="page-head">
  <div class="titles">
    <h2>数据推送</h2>
    <p>推送组件（隔离子进程 + 目标域白名单 + 发布签名门）与投递 outbox 状态。</p>
  </div>
  <div class="actions"><button class="btn" id="new-comp" type="button">＋ 新建组件</button></div>
</div>
<div class="grid cols-4" id="stats" style="margin-bottom:16px"></div>

<div class="card card-pad" id="comp-form" hidden style="margin-bottom:16px">
  <div class="field"><label>组件名（同内容去重，同名递增版本）</label><input id="c-name" autocomplete="off" /></div>
  <div class="field"><label>源码（固定方法 <code>push(ctx)</code>；隔离子进程执行，出网仅白名单域）</label>
    <textarea id="c-code" rows="6" placeholder="def push(ctx):\n    ctx.http.post('https://example.com/hook', json={'rows': ctx.rows})"></textarea></div>
  <div class="field"><label>出网白名单域（逗号分隔）</label><input id="c-domains" placeholder="example.com, api.example.com" autocomplete="off" /></div>
  <div class="field"><label>下游凭证 JSON（可选，KEK 加密存储）</label><textarea id="c-creds" rows="2" placeholder='{"token": "..."}'></textarea></div>
  <div id="c-err" class="form-error" hidden></div>
  <div class="form-actions"><button class="btn" id="c-submit" type="button">创建（草稿）</button>
    <button class="btn ghost" id="c-cancel" type="button">取消</button></div>
</div>

<div class="card"><div class="card-head">推送组件</div><div id="box"><div class="empty">加载中…</div></div></div>
<script src="/static/views.js"></script>
<script>
  const box = document.getElementById("box");
  const COLS = [
    { key: "id", label: "#", type: "mono" },
    { key: "name", label: "组件" },
    { key: "version", label: "版本", type: "mono" },
    { key: "status", label: "状态", type: "badge" },
    { key: "allow_domains", label: "出网白名单域", type: "list" },
    { key: "signed", label: "已签名", type: "bool" },
    { key: "created_at", label: "创建时间", type: "time" },
  ];

  async function load() {
    try {
      const d = await PypViews.fetchJSON("/api/views/push");
      const ob = d.outbox || {};
      PypViews.renderStats(document.getElementById("stats"), [
        { k: "待投递", v: ob.pending || 0 },
        { k: "投递中", v: ob.inflight || 0 },
        { k: "已送达", v: ob.sent || 0 },
        { k: "死信", v: ob.dead || 0, dir: ob.dead ? "down" : "flat" },
      ]);
      const comps = d.components || [];
      const head = "<tr>" + COLS.map((c) => `<th>${c.label}</th>`).join("") + "<th style='text-align:right'>操作</th></tr>";
      const rows = comps.length
        ? comps.map((c) => "<tr>" + COLS.map((col) => PypViews.cell(c, col)).join("") +
            `<td style="text-align:right">${compActions(c)}</td></tr>`).join("")
        : `<tr><td colspan="${COLS.length + 1}"><div class="empty">还没有推送组件</div></td></tr>`;
      box.innerHTML = `<div class="table-wrap"><table class="tbl"><thead>${head}</thead><tbody>${rows}</tbody></table></div>`;
      box.querySelectorAll("button.push-test").forEach((b) => b.addEventListener("click", () => enqueue(b.dataset.id, b)));
      box.querySelectorAll("button.comp-status").forEach((b) =>
        b.addEventListener("click", () => post(`/api/push/components/${b.dataset.id}/status`, { status: b.dataset.to }, b)));
      box.querySelectorAll("button.comp-publish").forEach((b) =>
        b.addEventListener("click", async () => { if (!(await PypViews.ask("发布后将签名并置为 active，确认？"))) return; post(`/api/push/components/${b.dataset.id}/publish`, null, b); }));
    } catch (e) {
      box.innerHTML = `<div class="empty err">${PypViews.esc(e.message)}</div>`;
    }
  }

  function compActions(c) {
    const btns = [`<button class="btn ghost sm push-test" data-id="${c.id}">测试入队</button>`];
    if (c.status !== "active") {
      if (c.status !== "testing") btns.push(`<button class="btn ghost sm comp-status" data-id="${c.id}" data-to="testing">转测试</button>`);
      if (c.status !== "draft") btns.push(`<button class="btn ghost sm comp-status" data-id="${c.id}" data-to="draft">转草稿</button>`);
      btns.push(`<button class="btn sm comp-publish" data-id="${c.id}">发布</button>`);
    }
    return btns.join(" ");
  }

  async function post(url, body, btn) {
    btn.disabled = true;
    try {
      const resp = await fetch(url, {
        method: "POST", headers: { "Content-Type": "application/json", Accept: "application/json" },
        body: body ? JSON.stringify(body) : null,
      });
      if (!resp.ok) throw new Error((await resp.json().catch(() => ({}))).detail || `HTTP ${resp.status}`);
      load();
    } catch (e) { PypViews.toast(`操作失败：${e.message}`, "err"); btn.disabled = false; }
  }

  async function enqueue(id, btn) {
    btn.disabled = true;
    const label = btn.textContent;
    btn.textContent = "入队中…";
    try {
      const resp = await fetch(`/api/push/components/${id}/enqueue`, {
        method: "POST", headers: { "Content-Type": "application/json", Accept: "application/json" },
        body: JSON.stringify({ rows: [{ _test: true, msg: "payipa 测试投递" }] }),
      });
      if (!resp.ok) throw new Error((await resp.json().catch(() => ({}))).detail || `HTTP ${resp.status}`);
      const n = (await resp.json()).enqueued;
      btn.textContent = n ? "已入队" : "幂等命中";
      setTimeout(load, 800);  // 刷新 outbox 计数
    } catch (e) { PypViews.toast(`入队失败：${e.message}`, "err"); btn.textContent = label; btn.disabled = false; }
  }

  // 新建组件面板
  const cForm = document.getElementById("comp-form"), cErr = document.getElementById("c-err");
  document.getElementById("new-comp").addEventListener("click", () => { cForm.hidden = !cForm.hidden; cErr.hidden = true; });
  document.getElementById("c-cancel").addEventListener("click", () => { cForm.hidden = true; });
  document.getElementById("c-submit").addEventListener("click", async () => {
    cErr.hidden = true;
    const name = document.getElementById("c-name").value.trim();
    const code = document.getElementById("c-code").value;
    if (!name || !code.trim()) { cErr.textContent = "组件名与源码必填"; cErr.hidden = false; return; }
    const domains = document.getElementById("c-domains").value.split(",").map((s) => s.trim()).filter(Boolean);
    const credsRaw = document.getElementById("c-creds").value.trim();
    let target_creds = null;
    if (credsRaw) {
      try { target_creds = JSON.parse(credsRaw); } catch { cErr.textContent = "凭证不是合法 JSON"; cErr.hidden = false; return; }
    }
    try {
      const resp = await fetch("/api/push/components", {
        method: "POST", headers: { "Content-Type": "application/json", Accept: "application/json" },
        body: JSON.stringify({ name, code, allow_domains: domains, target_creds }),
      });
      if (!resp.ok) throw new Error((await resp.json().catch(() => ({}))).detail || `HTTP ${resp.status}`);
      cForm.hidden = true;
      ["c-name", "c-code", "c-domains", "c-creds"].forEach((id) => (document.getElementById(id).value = ""));
      load();
    } catch (e) { cErr.textContent = e.message; cErr.hidden = false; }
  });

  load();
</script>
{% endblock %}
