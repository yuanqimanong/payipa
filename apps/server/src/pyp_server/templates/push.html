{% extends "base.html" %}
{% block title %}数据推送{% endblock %}
{% block content %}
<div class="page-head">
  <div class="titles">
    <h2>数据推送</h2>
    <p>推送组件（隔离子进程 + 目标域白名单 + 发布签名门）与投递 outbox 状态。</p>
  </div>
</div>
<div class="grid cols-4" id="stats" style="margin-bottom:16px"></div>
<div class="card"><div class="card-head">推送组件</div><div id="box"><div class="empty">加载中…</div></div></div>
<script src="/static/views.js"></script>
<script>
  const box = document.getElementById("box");
  const COLS = [
    { key: "id", label: "#", type: "mono" },
    { key: "name", label: "组件" },
    { key: "version", label: "版本", type: "mono" },
    { key: "status", label: "状态", type: "badge" },
    { key: "allow_domains", label: "出网白名单域", type: "list" },
    { key: "signed", label: "已签名", type: "bool" },
    { key: "created_at", label: "创建时间", type: "time" },
  ];

  async function load() {
    try {
      const d = await PypViews.fetchJSON("/api/views/push");
      const ob = d.outbox || {};
      PypViews.renderStats(document.getElementById("stats"), [
        { k: "待投递", v: ob.pending || 0 },
        { k: "投递中", v: ob.inflight || 0 },
        { k: "已送达", v: ob.sent || 0 },
        { k: "死信", v: ob.dead || 0, dir: ob.dead ? "down" : "flat" },
      ]);
      const comps = d.components || [];
      const head = "<tr>" + COLS.map((c) => `<th>${c.label}</th>`).join("") + "<th style='text-align:right'>操作</th></tr>";
      const rows = comps.length
        ? comps.map((c) => "<tr>" + COLS.map((col) => PypViews.cell(c, col)).join("") +
            `<td style="text-align:right"><button class="btn ghost sm push-test" data-id="${c.id}">测试入队</button></td></tr>`).join("")
        : `<tr><td colspan="${COLS.length + 1}"><div class="empty">还没有推送组件</div></td></tr>`;
      box.innerHTML = `<div class="table-wrap"><table class="tbl"><thead>${head}</thead><tbody>${rows}</tbody></table></div>`;
      box.querySelectorAll("button.push-test").forEach((b) =>
        b.addEventListener("click", () => enqueue(b.dataset.id, b)));
    } catch (e) {
      box.innerHTML = `<div class="empty err">${PypViews.esc(e.message)}</div>`;
    }
  }

  async function enqueue(id, btn) {
    btn.disabled = true;
    const label = btn.textContent;
    btn.textContent = "入队中…";
    try {
      const resp = await fetch(`/api/push/components/${id}/enqueue`, {
        method: "POST", headers: { "Content-Type": "application/json", Accept: "application/json" },
        body: JSON.stringify({ rows: [{ _test: true, msg: "payipa 测试投递" }] }),
      });
      if (!resp.ok) throw new Error((await resp.json().catch(() => ({}))).detail || `HTTP ${resp.status}`);
      const n = (await resp.json()).enqueued;
      btn.textContent = n ? "已入队" : "幂等命中";
      setTimeout(load, 800);  // 刷新 outbox 计数
    } catch (e) { alert(`入队失败：${e.message}`); btn.textContent = label; btn.disabled = false; }
  }

  load();
</script>
{% endblock %}
