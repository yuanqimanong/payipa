{% extends "base.html" %}
{% block title %}用户管理{% endblock %}
{% block content %}
<div class="page-head">
  <div class="titles">
    <h2>用户管理</h2>
    <p>平台账号及其角色（停用不删除）。新建账号由管理员开通，无自助注册。</p>
  </div>
  <div class="actions"><button class="btn" id="new-user" type="button">＋ 新建用户</button></div>
</div>

<div class="card card-pad" id="create-panel" hidden style="margin-bottom:16px; max-width:520px">
  <div class="field">
    <label>用户名</label>
    <input id="cu-username" autocomplete="off" />
  </div>
  <div class="field">
    <label>初始密码（≥8 位）</label>
    <input id="cu-password" type="password" autocomplete="new-password" />
  </div>
  <div class="field">
    <label>显示名（可选）</label>
    <input id="cu-display" autocomplete="off" />
  </div>
  <div id="cu-error" class="form-error" hidden></div>
  <div class="form-actions">
    <button class="btn" id="cu-submit" type="button">创建</button>
    <button class="btn ghost" id="cu-cancel" type="button">取消</button>
  </div>
</div>

<div class="card" id="box"><div class="empty">加载中…</div></div>
<script src="/static/views.js"></script>
<script>
  const box = document.getElementById("box");
  const COLS = [
    { key: "id", label: "#", type: "mono" },
    { key: "username", label: "用户名" },
    { key: "display_name", label: "显示名" },
    { key: "status", label: "状态", type: "badge" },
    { key: "roles", label: "角色", type: "list" },
    { key: "created_at", label: "创建时间", type: "time" },
  ];

  function actionCell(u) {
    const toggle = u.status === "active" ? "disabled" : "active";
    const label = u.status === "active" ? "停用" : "启用";
    return `<button class="btn ghost sm user-toggle" data-id="${u.id}" data-to="${toggle}">${label}</button>`;
  }

  async function load() {
    try {
      const users = await PypViews.fetchJSON("/api/views/users");
      const head = "<tr>" + COLS.map((c) => `<th>${c.label}</th>`).join("") + "<th style='text-align:right'>操作</th></tr>";
      const rows = users.length
        ? users.map((u) => "<tr>" + COLS.map((c) => PypViews.cell(u, c)).join("") +
            `<td style="text-align:right">${actionCell(u)}</td></tr>`).join("")
        : `<tr><td colspan="${COLS.length + 1}"><div class="empty">还没有用户</div></td></tr>`;
      box.innerHTML = `<div class="table-wrap"><table class="tbl"><thead>${head}</thead><tbody>${rows}</tbody></table></div>`;
      box.querySelectorAll("button.user-toggle").forEach((btn) => {
        btn.addEventListener("click", () => setStatus(btn.dataset.id, btn.dataset.to, btn));
      });
    } catch (e) {
      box.innerHTML = `<div class="empty err">${PypViews.esc(e.message)}</div>`;
    }
  }

  async function setStatus(id, status, btn) {
    btn.disabled = true;
    try {
      const resp = await fetch(`/api/users/${id}/status`, {
        method: "POST", headers: { "Content-Type": "application/json", Accept: "application/json" },
        body: JSON.stringify({ status }),
      });
      if (!resp.ok) throw new Error((await resp.json().catch(() => ({}))).detail || `HTTP ${resp.status}`);
      await load();
    } catch (e) { alert(`操作失败：${e.message}`); btn.disabled = false; }
  }

  // 新建用户面板
  const panel = document.getElementById("create-panel");
  const err = document.getElementById("cu-error");
  document.getElementById("new-user").addEventListener("click", () => { panel.hidden = false; err.hidden = true; });
  document.getElementById("cu-cancel").addEventListener("click", () => { panel.hidden = true; });
  document.getElementById("cu-submit").addEventListener("click", async () => {
    err.hidden = true;
    const username = document.getElementById("cu-username").value.trim();
    const password = document.getElementById("cu-password").value;
    const display_name = document.getElementById("cu-display").value.trim() || null;
    if (!username || password.length < 8) {
      err.textContent = "用户名必填，密码至少 8 位"; err.hidden = false; return;
    }
    try {
      const resp = await fetch("/api/users", {
        method: "POST", headers: { "Content-Type": "application/json", Accept: "application/json" },
        body: JSON.stringify({ username, password, display_name }),
      });
      if (!resp.ok) throw new Error((await resp.json().catch(() => ({}))).detail || `HTTP ${resp.status}`);
      panel.hidden = true;
      document.getElementById("cu-username").value = "";
      document.getElementById("cu-password").value = "";
      document.getElementById("cu-display").value = "";
      await load();
    } catch (e) { err.textContent = e.message; err.hidden = false; }
  });

  load();
</script>
{% endblock %}
