{% extends "base.html" %}
{% block title %}用户管理{% endblock %}
{% block content %}
<div class="page-head">
  <div class="titles">
    <h2>用户管理</h2>
    <p>平台账号及其角色（停用不删除）。新建账号由管理员开通，无自助注册。</p>
  </div>
  <div class="actions">
    <input id="q" type="text" placeholder="按用户名/显示名搜索…" maxlength="64" style="width:200px" />
    <button class="btn ghost" id="q-btn" type="button">搜索</button>
    <button class="btn" id="new-user" type="button">＋ 新建用户</button>
  </div>
</div>

<div class="card card-pad" id="create-panel" hidden style="margin-bottom:16px; max-width:520px">
  <div class="field">
    <label>用户名</label>
    <input id="cu-username" autocomplete="off" />
  </div>
  <div class="field">
    <label>初始密码（≥8 位）</label>
    <input id="cu-password" type="password" autocomplete="new-password" />
  </div>
  <div class="field">
    <label>显示名（可选）</label>
    <input id="cu-display" autocomplete="off" />
  </div>
  <div id="cu-error" class="form-error" hidden></div>
  <div class="form-actions">
    <button class="btn" id="cu-submit" type="button">创建</button>
    <button class="btn ghost" id="cu-cancel" type="button">取消</button>
  </div>
</div>

<div class="card" id="box"><div class="empty">加载中…</div></div>
<script src="/static/views.js"></script>
<script>
  const box = document.getElementById("box");
  const esc = PypViews.esc;
  let allRoles = [];  // 可授予的角色名（roles.manage 可读时填充）
  const COLS = [
    { key: "id", label: "#", type: "mono" },
    { key: "username", label: "用户名" },
    { key: "display_name", label: "显示名" },
    { key: "status", label: "状态", type: "badge" },
  ];

  function actionCell(u) {
    const toggle = u.status === "active" ? "disabled" : "active";
    const label = u.status === "active" ? "停用" : "启用";
    return `<button class="btn ghost sm user-pw" data-id="${u.id}" data-name="${esc(u.username)}">重置密码</button> ` +
      `<button class="btn ghost sm user-toggle" data-id="${u.id}" data-to="${toggle}">${label}</button>`;
  }

  function rolesCell(u) {
    const pills = (u.roles || []).map((r) =>
      `<span class="pill">${esc(r)} <a href="#" class="role-x" data-id="${u.id}" data-role="${esc(r)}" title="撤销">✕</a></span>`
    ).join(" ") || "<span class='muted'>—</span>";
    const options = allRoles.filter((r) => !(u.roles || []).includes(r));
    const grant = options.length
      ? `<select class="role-grant" data-id="${u.id}" style="width:auto; margin-left:6px">` +
        `<option value="">＋授予…</option>` + options.map((r) => `<option>${esc(r)}</option>`).join("") + "</select>"
      : "";
    return `<td>${pills}${grant}</td>`;
  }

  async function load() {
    try {
      // 角色清单（roles.manage 才可读；无权限则不显示授予下拉，静默降级）
      allRoles = await PypViews.fetchJSON("/api/views/roles").then((rs) => rs.map((r) => r.name)).catch(() => []);
      // 服务端搜索：q 拼进 fetch URL（用户名/显示名 ILIKE）
      const q = document.getElementById("q").value.trim();
      const users = await PypViews.fetchJSON("/api/views/users" + (q ? `?q=${encodeURIComponent(q)}` : ""));
      const head = "<tr>" + COLS.map((c) => `<th>${c.label}</th>`).join("") +
        "<th>角色</th><th style='text-align:right'>操作</th></tr>";
      const rows = users.length
        ? users.map((u) => "<tr>" + COLS.map((c) => PypViews.cell(u, c)).join("") + rolesCell(u) +
            `<td style="text-align:right">${actionCell(u)}</td></tr>`).join("")
        : `<tr><td colspan="${COLS.length + 2}"><div class="empty">还没有用户</div></td></tr>`;
      box.innerHTML = `<div class="table-wrap"><table class="tbl"><thead>${head}</thead><tbody>${rows}</tbody></table></div>`;
      box.querySelectorAll("button.user-toggle").forEach((btn) =>
        btn.addEventListener("click", () => setStatus(btn.dataset.id, btn.dataset.to, btn)));
      box.querySelectorAll("button.user-pw").forEach((btn) =>
        btn.addEventListener("click", () => resetPassword(btn.dataset.id, btn.dataset.name)));
      box.querySelectorAll("a.role-x").forEach((a) =>
        a.addEventListener("click", (e) => { e.preventDefault(); setRole(a.dataset.id, a.dataset.role, "revoke"); }));
      box.querySelectorAll("select.role-grant").forEach((sel) =>
        sel.addEventListener("change", () => { if (sel.value) setRole(sel.dataset.id, sel.value, "grant"); }));
    } catch (e) {
      box.innerHTML = `<div class="empty err">${esc(e.message)}</div>`;
    }
  }

  async function setRole(id, role, action) {
    try {
      const resp = await fetch(`/api/users/${id}/roles`, {
        method: "POST", headers: { "Content-Type": "application/json", Accept: "application/json" },
        body: JSON.stringify({ role, action }),
      });
      if (!resp.ok) throw new Error((await resp.json().catch(() => ({}))).detail || `HTTP ${resp.status}`);
      await load();
    } catch (e) { PypViews.toast(`角色操作失败：${e.message}`, "err"); }
  }

  async function resetPassword(id, name) {
    const pw = prompt(`为用户 ${name} 设置新密码（≥8 位）：`);
    if (pw == null) return;  // 取消
    if (pw.length < 8) { PypViews.toast("密码至少 8 位", "err"); return; }
    try {
      const resp = await fetch(`/api/users/${id}/password`, {
        method: "POST", headers: { "Content-Type": "application/json", Accept: "application/json" },
        body: JSON.stringify({ password: pw }),
      });
      if (!resp.ok) throw new Error((await resp.json().catch(() => ({}))).detail || `HTTP ${resp.status}`);
      PypViews.toast(`已重置 ${name} 的密码`, "ok");
    } catch (e) { PypViews.toast(`重置失败：${e.message}`, "err"); }
  }

  async function setStatus(id, status, btn) {
    btn.disabled = true;
    try {
      const resp = await fetch(`/api/users/${id}/status`, {
        method: "POST", headers: { "Content-Type": "application/json", Accept: "application/json" },
        body: JSON.stringify({ status }),
      });
      if (!resp.ok) throw new Error((await resp.json().catch(() => ({}))).detail || `HTTP ${resp.status}`);
      await load();
    } catch (e) { PypViews.toast(`操作失败：${e.message}`, "err"); btn.disabled = false; }
  }

  // 新建用户面板
  const panel = document.getElementById("create-panel");
  const err = document.getElementById("cu-error");
  document.getElementById("new-user").addEventListener("click", () => { panel.hidden = false; err.hidden = true; });
  document.getElementById("cu-cancel").addEventListener("click", () => { panel.hidden = true; });
  document.getElementById("cu-submit").addEventListener("click", async () => {
    err.hidden = true;
    const username = document.getElementById("cu-username").value.trim();
    const password = document.getElementById("cu-password").value;
    const display_name = document.getElementById("cu-display").value.trim() || null;
    if (!username || password.length < 8) {
      err.textContent = "用户名必填，密码至少 8 位"; err.hidden = false; return;
    }
    try {
      const resp = await fetch("/api/users", {
        method: "POST", headers: { "Content-Type": "application/json", Accept: "application/json" },
        body: JSON.stringify({ username, password, display_name }),
      });
      if (!resp.ok) throw new Error((await resp.json().catch(() => ({}))).detail || `HTTP ${resp.status}`);
      panel.hidden = true;
      document.getElementById("cu-username").value = "";
      document.getElementById("cu-password").value = "";
      document.getElementById("cu-display").value = "";
      await load();
    } catch (e) { err.textContent = e.message; err.hidden = false; }
  });

  document.getElementById("q-btn").addEventListener("click", load);
  document.getElementById("q").addEventListener("keydown", (e) => { if (e.key === "Enter") load(); });
  load();
</script>
{% endblock %}
