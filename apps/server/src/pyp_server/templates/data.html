{% extends "base.html" %}
{% block title %}数据 · {{ source }}{% endblock %}
{% block head %}
<link rel="stylesheet" href="/static/vendor/tabulator/tabulator.min.css" />
<script src="/static/vendor/tabulator/tabulator.min.js"></script>
<script src="/static/vendor/htmx/htmx.min.js"></script>
<style>
  .tabulator { border: 0; background: transparent; font-size: 13.5px; }
  .tabulator .tabulator-header { border-bottom: 3px solid var(--ink); background: var(--surface-2);
    font-weight: 800; text-transform: uppercase; letter-spacing: .04em; }
  .tabulator .tabulator-col { border-right: 1.5px solid var(--gray-bg); }
  .tabulator-row { border-bottom: 1.5px solid var(--gray-bg); }
  .tabulator-row.tabulator-row-even { background: color-mix(in srgb, var(--surface-2) 50%, transparent); }
  .tabulator-row.tabulator-selectable:hover,
  .tabulator-row:hover { background: var(--accent-weak) !important; }
  .tabulator .tabulator-header-filter input { border: 2px solid var(--border-strong);
    border-radius: var(--radius-sm); padding: 4px 7px; }
  .tabulator .tabulator-footer { border-top: 3px solid var(--ink); background: var(--surface-2); }
  .tabulator .tabulator-page.active { background: var(--accent); color: #fff; border: 2px solid var(--ink); }
</style>
{% endblock %}
{% block content %}
<div class="page-head">
  <div class="titles">
    <h2>数据源 <code>{{ source }}</code> 产出</h2>
    <p>Tabulator remote：表头筛选 / 点列头排序 / 分页 —— 全部服务端译 SQL。</p>
  </div>
  <div class="actions"><a class="btn ghost" href="/sources">← 返回列表</a></div>
</div>
<div class="card card-pad">
  <div id="grid"></div>
</div>
<script>
  new Tabulator("#grid", {
    ajaxURL: "/api/data/{{ source }}",
    layout: "fitDataStretch",
    placeholder: "暂无数据（该数据源尚未采集或无匹配）",
    pagination: true, paginationMode: "remote", paginationSize: 20,
    paginationSizeSelector: [10, 20, 50, 100],
    filterMode: "remote", sortMode: "remote", autoColumns: true,
    columnDefaults: { headerFilter: "input", headerFilterLiveFilter: false },
  });
</script>
{% endblock %}
