{% extends "base.html" %}
{% block title %}操作日志{% endblock %}
{% block content %}
<div class="page-head">
  <div class="titles">
    <h2>操作日志</h2>
    <p>平台审计日志（RBAC 敏感操作、访问复核、推送等），最新在前。</p>
  </div>
  <div class="actions">
    <input id="filter" type="text" placeholder="按动作筛选，如 source.create" style="width:220px" />
    <button class="btn ghost" id="prev" type="button" disabled>← 上一页</button>
    <button class="btn ghost" id="next" type="button">下一页 →</button>
  </div>
</div>
<div class="card" id="box"><div class="empty">加载中…</div></div>
<script src="/static/views.js"></script>
<script>
  const PAGE = 50;
  let offset = 0, action = "";
  const COLS = [
    { key: "at", label: "时间", type: "time" },
    { key: "actor", label: "操作者" },
    { key: "action", label: "动作", type: "mono" },
    { key: "object_type", label: "对象类型" },
    { key: "object_id", label: "对象", type: "mono" },
    { key: "source", label: "来源", type: "badge" },
  ];
  const box = document.getElementById("box");
  const prev = document.getElementById("prev");
  const next = document.getElementById("next");

  async function load() {
    const qs = new URLSearchParams({ limit: PAGE, offset });
    if (action) qs.set("action", action);
    try {
      const rows = await PypViews.fetchJSON(`/api/views/audit?${qs}`);
      PypViews.renderTable(box, COLS, rows);
      prev.disabled = offset === 0;
      next.disabled = rows.length < PAGE;  // 不足一页 = 已到末尾
    } catch (e) {
      box.innerHTML = `<div class="empty err">${PypViews.esc(e.message)}</div>`;
    }
  }
  prev.addEventListener("click", () => { offset = Math.max(0, offset - PAGE); load(); });
  next.addEventListener("click", () => { offset += PAGE; load(); });
  let timer;
  document.getElementById("filter").addEventListener("input", (e) => {
    clearTimeout(timer);
    timer = setTimeout(() => { action = e.target.value.trim(); offset = 0; load(); }, 300);
  });
  load();
</script>
{% endblock %}
