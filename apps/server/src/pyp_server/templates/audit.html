{% extends "base.html" %}
{% block title %}操作日志{% endblock %}
{% block content %}
<div class="page-head">
  <div class="titles">
    <h2>操作日志</h2>
    <p>平台审计日志（RBAC 敏感操作、访问复核、推送等），最新在前。</p>
  </div>
</div>
<div class="card" id="box"><div class="empty">加载中…</div></div>
<script src="/static/views.js"></script>
<script>
  PypViews.loadTable(document.getElementById("box"), "/api/views/audit", [
    { key: "at", label: "时间", type: "time" },
    { key: "actor", label: "操作者" },
    { key: "action", label: "动作", type: "mono" },
    { key: "object_type", label: "对象类型" },
    { key: "object_id", label: "对象", type: "mono" },
    { key: "source", label: "来源", type: "badge" },
  ]);
</script>
{% endblock %}
