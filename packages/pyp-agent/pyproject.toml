[project]
name = "pyp-agent"
version = "0.1.0"
description = "payipa 子节点 agent：出站 WS、抓取、大对象直传、回传指针；只依赖 contracts（禁止依赖 core）"
readme = "README.md"
requires-python = ">=3.14"
# 依赖刻意最小：contracts + jbutils + HTTP/WS + 并发底座。绝不含 payipa-core / SQLAlchemy / DB 驱动。
dependencies = [
    "payipa-contracts",
    "jianbing-utils",
    "niquests>=3.20",
    "websockets>=16",
    "anyio>=4.14",
    "parsel>=1.9",       # xpath/css 选择器（内置声明式解释器）
    "jsonpath-ng>=1.6",  # jsonpath 定位（API 型数据源）
    "dateparser>=1.2",   # 业务时间解析（parse_date 清洗算子）
]

# 可选：浏览器自动化能力（M5，标准 Playwright）。装了才上报 automation 能力、接 browser 引擎任务。
# uv sync --package pyp-agent --extra browser 后需 `uv run playwright install chromium` 装浏览器运行时。
[project.optional-dependencies]
browser = ["playwright>=1.49"]

[project.scripts]
pyp-agent = "pyp_agent.cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
