# payipa 主控一键编排（P0-02）：db → migrate（one-shot 迁移）→ server（readyz 健康门）→ 可选 agent。
# 推荐从 payipa 仓库根执行 `uv run pypctl init` → `doctor` → `up --build`；
# 生产配置可直接用 `uv run pypctl init --production-host pyp.example.com` 生成。
# 亦可直接调用 docker compose（需显式 --env-file deploy/.env.compose）。
# 默认只把主控绑定到 127.0.0.1:8100；生产由同机 TLS 反向代理转发。
# 约定：db 不映射宿主端口（服务间内网互联即可，避免与本机已有 PostgreSQL 的 5432 冲突）；
#      server 映射宿主 8100 → 容器 8000（8000 常被本机 dev 主控占用）。
name: payipa

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?先 uv run pypctl init 生成 deploy/.env.compose 并以 --env-file 传入}
      POSTGRES_DB: ${PG_DB_PYP:-pyp_sys} # 平台库；另外两库由 initdb 脚本补建
      PG_DB_DATA_CENTER: ${PG_DB_DATA_CENTER:-data_center}
      PG_DB_BUSINESS: ${PG_DB_BUSINESS:-business}
    volumes:
      - pgdata:/var/lib/postgresql # postgres 18 起数据卷挂载点为 /var/lib/postgresql（非 …/data）
      - ./initdb:/docker-entrypoint-initdb.d:ro # 首次初始化补建 data_center / business 两库
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-postgres} -d ${PG_DB_PYP:-pyp_sys}"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # 迁移是显式 one-shot job（P0-04 / 03 §3.4-3）：server 不抢跑迁移，migrate 成功后才放行 server。
  migrate:
    image: payipa-server:local
    build:
      context: .. # payipa 仓库根；依赖由 uv.lock 自包含解析
      dockerfile: deploy/Dockerfile.server
    env_file: .env.compose
    command: ["alembic", "-c", "deploy/alembic.ini", "upgrade", "heads"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  server:
    image: payipa-server:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    env_file: .env.compose
    ports:
      - "${PYP_DEPLOY_BIND_ADDRESS:-127.0.0.1}:8100:8000"
    volumes:
      - pyp_data:/data # 本地对象存储根（镜像内 DATA_ROOT=/data）
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck: # runtime 镜像无 curl：用 stdlib 探 readyz（503 时 urlopen 抛错 → 非 0 退出）
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3).status==200 else 1)",
        ]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    restart: unless-stopped

  # 可选单采集节点：先启动主控、创建管理员，再从节点页签发一次性入网码并执行 `pypctl agent --build`。
  agent:
    profiles: ["agents"]
    image: payipa-agent:local
    build:
      context: ..
      dockerfile: packages/pyp-agent/Dockerfile
    command:
      - join
      - --server
      - http://server:8000 # 服务间内网直连，不经宿主端口
      - --token
      - ${PYP_AGENT_ENROLL_TOKEN:-missing-enrollment-token}
      - --state-dir
      - /state # 身份持久卷：容器重建节点身份不变（P0-08）
    volumes:
      - agent_state:/state
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  pyp_data:
  agent_state:
