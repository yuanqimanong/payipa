# Alembic config for payipa three databases (multidb; ASCII only -- alembic reads this
# with the OS locale codec, which is GBK on Windows and rejects non-ASCII bytes).
#
# One shared revision history; each revision has per-engine upgrade_<db>() functions.
# A single command migrates all three databases (each DB has its own alembic_version table).
# Connection URLs are built in env.py from pydantic-settings (.env); the urls below stay empty.
#
# Usage (run from the payipa root):
#   uv run alembic -c deploy/alembic.ini upgrade head
#   uv run alembic -c deploy/alembic.ini revision --autogenerate -m "msg"
#   uv run alembic -c deploy/alembic.ini downgrade base
[alembic]
script_location = deploy/alembic
prepend_sys_path = .
path_separator = os
databases = pyp, data_center, business

[pyp]
sqlalchemy.url =

[data_center]
sqlalchemy.url =

[business]
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
